syntax = "proto3";

package auth;

option go_package = "github.com/Rizwank123/LahziCart/shared/proto/authpb";

service AuthService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string error = 2;
  string user_id = 3;
  string role = 4;
  string jti = 5;
}
